<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Store Assistant — Test UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f1a;
      --surface:   #13162b;
      --glass:     rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --accent:    #6c63ff;
      --accent2:   #a78bfa;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --user-bg:   linear-gradient(135deg, #6c63ff, #a78bfa);
      --bot-bg:    rgba(255,255,255,0.05);
      --radius:    16px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(108,99,255,0.18) 0%, transparent 70%);
    }

    /* Header */
    .header {
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 0 20px 0;
    }
    .logo {
      width: 44px; height: 44px;
      background: var(--user-bg);
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 0 24px rgba(108,99,255,0.45);
    }
    .header-text h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; }
    .header-text p  { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    /* Config bar */
    .config-bar {
      width: 100%;
      max-width: 780px;
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .config-bar label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 160px;
    }
    .config-bar select,
    .config-bar input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 8px 12px;
      outline: none;
      transition: border-color .2s;
    }
    .config-bar select:focus,
    .config-bar input:focus { border-color: var(--accent); }
    .config-bar select option { background: #1e2235; }

    /* Chat window */
    .chat-window {
      width: 100%;
      max-width: 780px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      height: 520px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      gap: 4px;
      animation: fadeUp .25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user  { align-self: flex-end; align-items: flex-end; }
    .msg.bot   { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }
    .msg-meta {
      font-size: 0.7rem;
      color: var(--muted);
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }
    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-6px); }
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    #msg-input {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px 16px;
      outline: none;
      transition: border-color .2s;
      resize: none;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--user-bg);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      width: 46px; height: 46px;
      display: grid; place-items: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: opacity .2s, transform .15s;
      align-self: flex-end;
    }
    #send-btn:hover  { opacity: .85; }
    #send-btn:active { transform: scale(.94); }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; }

    .error-banner {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.82rem;
      padding: 8px 14px;
      animation: fadeUp .2s ease;
    }

    @media (max-width: 820px) {
      body { padding: 16px; justify-content: flex-start; }
      .chat-window { height: calc(100vh - 220px); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🛍️</div>
    <div class="header-text">
      <h1>AI Store Assistant</h1>
      <p>Test UI — talks to your local FastAPI server</p>
    </div>
  </div>

  <div class="config-bar">
    <label>
      Server URL
      <input id="server-url" type="text" value="http://127.0.0.1:8000" placeholder="http://127.0.0.1:8000" />
    </label>
    <label>
      API Key (store)
      <select id="api-key">
        <option value="sk_store_a">sk_store_a → store_a</option>
        <option value="sk_store_b">sk_store_b → store_b</option>
      </select>
    </label>
  </div>

  <div class="chat-window">
    <div class="status-bar">
      <span class="dot"></span>
      <span>Connected to local server &nbsp;·&nbsp; Model: Groq</span>
    </div>

    <div class="messages" id="messages">
      <div class="msg bot">
        <div class="bubble">
          👋 Hi! I'm your store assistant. Ask me about products or orders — e.g. <em>"Do you have red shoes?"</em> or <em>"What's the status of order 101?"</em>
        </div>
        <span class="msg-meta">Assistant · now</span>
      </div>
    </div>

    <div class="input-row">
      <textarea id="msg-input" rows="1" placeholder="Ask about a product or order…"></textarea>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('msg-input');
    const sendBtn    = document.getElementById('send-btn');
    const serverUrl  = document.getElementById('server-url');
    const apiKeyEl   = document.getElementById('api-key');

    function timestamp() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, text) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const meta = document.createElement('span');
      meta.className = 'msg-meta';
      meta.textContent = `${role === 'user' ? 'You' : 'Assistant'} · ${timestamp()}`;

      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function addTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'msg bot typing';
      wrap.innerHTML = `
        <div class="bubble">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>`;
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function addError(msg) {
      const el = document.createElement('div');
      el.className = 'error-banner';
      el.textContent = '⚠️ ' + msg;
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      addMessage('user', question);
      const typing = addTyping();

      try {
        const res = await fetch(`${serverUrl.value.replace(/\/$/, '')}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, api_key: apiKeyEl.value }),
        });

        typing.remove();

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          addError(`Server error ${res.status}: ${err.detail || res.statusText}`);
        } else {
          const data = await res.json();
          addMessage('bot', data.answer);
        }
      } catch (e) {
        typing.remove();
        addError(`Could not reach server — is it running? (${e.message})`);
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);
  </script>
</body>
</html>
