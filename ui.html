<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Store Assistant — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f0f2f5;
      --surface:      #ffffff;
      --border:       #e4e6eb;
      --accent:       #6b7bf7;
      --accent-dark:  #5a6ae6;
      --accent-light: #eef0ff;
      --user-bg:      linear-gradient(135deg, #6b7bf7 0%, #8b9cf9 100%);
      --bot-bg:       #ffffff;
      --text:         #1a1d26;
      --text-secondary: #6b7280;
      --muted:        #9ca3af;
      --radius:       16px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,0.06);
      --shadow-md:    0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg:    0 8px 32px rgba(0,0,0,0.12);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* ═══ Main container ═══ */
    .chat-container {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      height: 520px;
      overflow: hidden;
      position: relative;
    }

    /* ═══ Header ═══ */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      z-index: 2;
    }

    .header-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--user-bg);
      display: grid; place-items: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(107, 123, 247, 0.35);
      position: relative;
    }

    .header-avatar::after {
      content: '';
      position: absolute;
      bottom: 2px; right: 2px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #22c55e;
      border: 2px solid var(--surface);
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    }

    .header-info { flex: 1; }
    .header-info h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .header-info p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent-light);
      color: var(--accent);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.2s ease;
    }
    .header-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: scale(1.05);
    }
    .header-btn svg { width: 18px; height: 18px; }

    /* ═══ Settings panel ═══ */
    .settings-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .settings-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .settings-panel {
      position: absolute;
      top: 0; right: -320px;
      width: 300px;
      height: 100%;
      background: var(--surface);
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      z-index: 11;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 0 20px 20px 0;
    }
    .settings-panel.open { right: 0; border-radius: 0; }

    .settings-panel h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-close {
      width: 32px; height: 32px;
      border: none;
      background: var(--bg);
      border-radius: 50%;
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .settings-close:hover { background: #ddd; }

    .settings-panel label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .settings-panel select,
    .settings-panel input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .settings-panel select:focus,
    .settings-panel input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(107, 123, 247, 0.15);
    }
    .settings-panel select option { background: var(--surface); }

    /* ═══ Side action buttons (colored pills on the right) ═══ */
    .side-actions {
      position: absolute;
      right: -54px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 1;
    }
    .side-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: grid; place-items: center;
      font-size: 16px;
      color: #fff;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .side-btn:hover { transform: scale(1.1); }
    .side-btn.green  { background: #22c55e; }
    .side-btn.red    { background: #ef4444; }
    .side-btn.amber  { background: #f59e0b; }

    /* ═══ Messages area ═══ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      background: var(--bg);
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 5px;
    }

    /* ═══ Message groups ═══ */
    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Bot (left-aligned) messages */
    .msg-group.bot { align-items: flex-start; max-width: 80%; }
    .msg-group.user { align-items: flex-end; max-width: 80%; align-self: flex-end; }

    .msg-sender {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .msg-group.user .msg-sender {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .msg-group.bot .msg-avatar {
      background: linear-gradient(135deg, #6b7bf7, #8b9cf9);
    }
    .msg-group.user .msg-avatar {
      background: linear-gradient(135deg, #f59e0b, #fb923c);
    }

    .msg-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }

    .msg-timestamp {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      margin-bottom: 2px;
    }
    .msg-group.bot .msg-timestamp { text-align: left; }

    .bubble {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: break-word;
      box-shadow: var(--shadow-sm);
      max-width: 100%;
    }

    .msg-group.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg-group.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    /* ═══ Typing indicator ═══ */
    .msg-group.typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 16px 20px;
      background: var(--bot-bg);
      border: 1px solid var(--border);
    }
    .typing-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-8px); opacity: 1; }
    }

    /* ═══ Input area ═══ */
    .input-area {
      padding: 16px 24px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: var(--bg);
      border-radius: 14px;
      padding: 6px 6px 6px 18px;
      border: 1px solid var(--border);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(107, 123, 247, 0.12);
    }

    #msg-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px 0;
      outline: none;
      resize: none;
      line-height: 1.4;
    }
    #msg-input::placeholder { color: var(--muted); }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 4px;
    }

    .attach-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.2s;
    }
    .attach-btn:hover {
      background: var(--accent-light);
      color: var(--accent);
    }
    .attach-btn svg { width: 20px; height: 20px; }

    #send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--user-bg);
      color: #fff;
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.2s;
      box-shadow: 0 2px 10px rgba(107, 123, 247, 0.35);
    }
    #send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(107, 123, 247, 0.5);
    }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    #send-btn svg { width: 18px; height: 18px; }

    /* ═══ Error banner ═══ */
    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      color: #dc2626;
      font-size: 0.82rem;
      padding: 10px 16px;
      animation: slideIn 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ═══ Responsive ═══ */
    @media (max-width: 860px) {
      .side-actions { display: none; }
    }
    @media (max-width: 640px) {
      body { padding: 0; }
      .chat-container {
        border-radius: 0;
        height: 100vh;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-avatar">🛍️</div>
      <div class="header-info">
        <h1>AI Store Assistant</h1>
        <p>Online — ready to help</p>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="settings-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Settings side panel -->
    <div class="settings-overlay" id="settings-overlay"></div>
    <div class="settings-panel" id="settings-panel">
      <h3>
        Settings
        <button class="settings-close" id="settings-close-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </h3>
      <label>
        Server URL
        <input id="server-url" type="text" value="" placeholder="Auto-detected or enter manually" />
      </label>
      <label>
        API Key (Store)
        <select id="api-key">
          <option value="sk_store_a">sk_store_a → store_a</option>
          <option value="sk_store_b">sk_store_b → store_b</option>
        </select>
      </label>
    </div>

    <!-- Side action buttons -->
    <div class="side-actions">
      <button class="side-btn green" title="Products">🛒</button>
      <button class="side-btn red" title="Orders">📦</button>
      <button class="side-btn amber" title="Help">❓</button>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <!-- Welcome message -->
      <div class="msg-group bot">
        <div class="msg-timestamp" id="welcome-time"></div>
        <div class="msg-sender">
          <div class="msg-avatar">AI</div>
          <span class="msg-name">Store Assistant</span>
        </div>
        <div class="bubble">
          👋 Hi! I'm your store assistant. Ask me about products or orders — e.g. <em>"Do you have red shoes?"</em> or <em>"What's the status of order 101?"</em>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-row">
        <textarea id="msg-input" rows="1" placeholder="Say something..."></textarea>
        <div class="input-actions">
          <button class="attach-btn" title="Attach file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button id="send-btn" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ═══ DOM refs ═══ */
    const messagesEl  = document.getElementById('messages');
    const inputEl     = document.getElementById('msg-input');
    const sendBtn     = document.getElementById('send-btn');
    const serverUrlEl = document.getElementById('server-url');

    // Auto-detect: if served from a real server, use same origin; if opened as file://, fall back to localhost
    const autoUrl = (window.location.protocol === 'file:') ? 'http://127.0.0.1:8000' : window.location.origin;
    serverUrlEl.value = autoUrl;
    const apiKeyEl    = document.getElementById('api-key');

    const settingsBtn     = document.getElementById('settings-btn');
    const settingsPanel   = document.getElementById('settings-panel');
    const settingsOverlay = document.getElementById('settings-overlay');
    const settingsClose   = document.getElementById('settings-close-btn');

    /* ═══ Settings panel toggle ═══ */
    function openSettings()  { settingsPanel.classList.add('open'); settingsOverlay.classList.add('open'); }
    function closeSettings() { settingsPanel.classList.remove('open'); settingsOverlay.classList.remove('open'); }
    settingsBtn.addEventListener('click', openSettings);
    settingsClose.addEventListener('click', closeSettings);
    settingsOverlay.addEventListener('click', closeSettings);

    /* ═══ Welcome timestamp ═══ */
    document.getElementById('welcome-time').textContent = formatTime(new Date());

    /* ═══ Helpers ═══ */
    function formatTime(date) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    /* ═══ Add a message ═══ */
    function addMessage(role, text) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}`;

      const time = document.createElement('div');
      time.className = 'msg-timestamp';
      time.textContent = formatTime(new Date());

      const sender = document.createElement('div');
      sender.className = 'msg-sender';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'user' ? 'You' : 'AI';

      const name = document.createElement('span');
      name.className = 'msg-name';
      name.textContent = role === 'user' ? 'You' : 'Store Assistant';

      sender.appendChild(avatar);
      sender.appendChild(name);

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      group.appendChild(time);
      group.appendChild(sender);
      group.appendChild(bubble);
      messagesEl.appendChild(group);
      scrollToBottom();
      return group;
    }

    /* ═══ Typing indicator ═══ */
    function addTyping() {
      const group = document.createElement('div');
      group.className = 'msg-group bot typing';

      const sender = document.createElement('div');
      sender.className = 'msg-sender';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = 'AI';

      const name = document.createElement('span');
      name.className = 'msg-name';
      name.textContent = 'Store Assistant';

      sender.appendChild(avatar);
      sender.appendChild(name);

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = `
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>`;

      group.appendChild(sender);
      group.appendChild(bubble);
      messagesEl.appendChild(group);
      scrollToBottom();
      return group;
    }

    /* ═══ Error display ═══ */
    function addError(msg) {
      const el = document.createElement('div');
      el.className = 'error-banner';
      el.textContent = '⚠️ ' + msg;
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    /* ═══ Send message ═══ */
    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      addMessage('user', question);
      const typing = addTyping();

      try {
        const res = await fetch(`${serverUrlEl.value.replace(/\/$/, '')}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, api_key: apiKeyEl.value }),
        });

        typing.remove();

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          addError(`Server error ${res.status}: ${err.detail || res.statusText}`);
        } else {
          const data = await res.json();
          addMessage('bot', data.answer);
        }
      } catch (e) {
        typing.remove();
        addError(`Could not reach server — is it running? (${e.message})`);
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    /* ═══ Auto-resize textarea ═══ */
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    /* ═══ Enter to send ═══ */
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    /* ═══ Side quick-action buttons ═══ */
    document.querySelectorAll('.side-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const title = btn.getAttribute('title');
        if (title === 'Products') {
          inputEl.value = 'What products do you have?';
          sendMessage();
        } else if (title === 'Orders') {
          inputEl.value = 'Show me all orders';
          sendMessage();
        } else if (title === 'Help') {
          inputEl.value = 'What can you help me with?';
          sendMessage();
        }
      });
    });
  </script>
</body>
</html>
